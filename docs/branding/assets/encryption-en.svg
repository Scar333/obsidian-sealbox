<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">SealBox encryption overview</title><desc id="desc">Password unwraps a random master key. HKDF derives file keys. AES-256-GCM encrypts chunked sealed files. Recovery key independently unwraps the master key.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1440" height="790" rx="0" fill="#171225" stroke="#171225"/><text x="56" y="66" font-size="34" fill="#f5f0ff" font-weight="600" >How your files are protected</text><text x="56" y="108" font-size="18" fill="#bfb1d2" font-weight="400" >Simplified overview · Standard vault-keyed mode</text><rect x="56" y="184" width="360" height="158" rx="20" fill="#241c36" stroke="#48365f"/><text x="80" y="220" font-size="15" fill="#c4a0ff" font-weight="400" >01</text><text x="80" y="265" font-size="26" fill="#f5f0ff" font-weight="600" >Master password</text><text x="80" y="303" font-size="17" fill="#bfb1d2" font-weight="400" >Argon2id / PBKDF2-SHA512</text><rect x="540" y="184" width="360" height="158" rx="20" fill="#241c36" stroke="#48365f"/><text x="564" y="220" font-size="15" fill="#c4a0ff" font-weight="400" >02</text><text x="564" y="265" font-size="26" fill="#f5f0ff" font-weight="600" >Master key</text><text x="564" y="303" font-size="17" fill="#bfb1d2" font-weight="400" >256-bit · random</text><rect x="1024" y="184" width="360" height="158" rx="20" fill="#241c36" stroke="#48365f"/><text x="1048" y="220" font-size="15" fill="#c4a0ff" font-weight="400" >03</text><text x="1048" y="265" font-size="26" fill="#f5f0ff" font-weight="600" >File key</text><text x="1048" y="303" font-size="17" fill="#bfb1d2" font-weight="400" >HKDF-SHA256 · unique salt</text><path d="M428 263H518" fill="none" stroke="#c4a0ff" stroke-width="2"/><path d="m512 257 8 6-8 6" fill="none" stroke="#c4a0ff" stroke-width="2"/><path d="M912 263H1002" fill="none" stroke="#c4a0ff" stroke-width="2"/><path d="m996 257 8 6-8 6" fill="none" stroke="#c4a0ff" stroke-width="2"/><text x="435" y="240" font-size="13" fill="#bfb1d2" font-weight="400" >unwrap</text><text x="922" y="240" font-size="13" fill="#bfb1d2" font-weight="400" >derive</text><rect x="540" y="402" width="360" height="128" rx="20" fill="#241c36" stroke="#48365f"/><text x="564" y="448" font-size="24" fill="#f5f0ff" font-weight="600" >Recovery key</text><text x="564" y="486" font-size="16" fill="#bfb1d2" font-weight="400" >Another way to unwrap the key</text><path d="M720 402V354" stroke="#c4a0ff" stroke-width="2"/><path d="m714 363 6-8 6 8" fill="none" stroke="#c4a0ff" stroke-width="2"/><rect x="1024" y="402" width="360" height="128" rx="20" fill="#c4a0ff" stroke="#c4a0ff"/><text x="1048" y="449" font-size="32" fill="#171225" font-weight="600" >.sealed</text><text x="1048" y="487" font-size="17" fill="#171225" font-weight="400" >AES-256-GCM · 1 MiB chunks</text><path d="M1204 354V389" stroke="#c4a0ff" stroke-width="2"/><path d="m1198 381 6 8 6-8" fill="none" stroke="#c4a0ff" stroke-width="2"/><text x="56" y="601" font-size="25" fill="#f5f0ff" font-weight="400" >Ciphertext on disk. Decrypted content in memory when opened.</text><text x="56" y="650" font-size="18" fill="#bfb1d2" font-weight="400" >File names, sizes and folder structure remain visible.</text><text x="56" y="688" font-size="18" fill="#bfb1d2" font-weight="400" >Protects data at rest; does not protect against malware on the device.</text><text x="56" y="741" font-size="15" fill="#bfb1d2" font-weight="400" >Diagram omits intermediate HKDF steps, AAD and optional modes.</text></g></svg>