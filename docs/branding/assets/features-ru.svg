<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
<title id="title">SealBox features</title><desc id="desc">Notes, attachments and secrets in encrypted containers. One unlock per session, recovery keys, English and Russian.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1440" height="590" rx="0" fill="#171225" stroke="#171225"/><text x="56" y="64" font-size="34" fill="#f5f0ff" font-weight="600" >Меньше действий. Больше приватности.</text><rect x="56" y="108" width="432" height="278" rx="20" fill="#241c36" stroke="#48365f"/><text x="84" y="154" font-size="18" fill="#c4a0ff" font-weight="500" >01</text><text x="84" y="228" font-size="32" fill="#f5f0ff" font-weight="600" >Заметки</text><text x="84" y="286" font-size="18" fill="#bfb1d2" font-weight="400" >Редактируйте внутри SealBox.</text><text x="84" y="317" font-size="18" fill="#bfb1d2" font-weight="400" >Сохраняйте в формате .sealed.</text><rect x="504" y="108" width="432" height="278" rx="20" fill="#241c36" stroke="#48365f"/><text x="532" y="154" font-size="18" fill="#c4a0ff" font-weight="500" >02</text><text x="532" y="228" font-size="32" fill="#f5f0ff" font-weight="600" >Вложения</text><text x="532" y="286" font-size="18" fill="#bfb1d2" font-weight="400" >Просматривайте изображения и PDF.</text><text x="532" y="317" font-size="18" fill="#bfb1d2" font-weight="400" >Шифруйте файлы любого типа.</text><rect x="952" y="108" width="432" height="278" rx="20" fill="#241c36" stroke="#48365f"/><text x="980" y="154" font-size="18" fill="#c4a0ff" font-weight="500" >03</text><text x="980" y="228" font-size="32" fill="#f5f0ff" font-weight="600" >Секреты</text><text x="980" y="286" font-size="18" fill="#bfb1d2" font-weight="400" >Логины, теги и свои поля.</text><text x="980" y="317" font-size="18" fill="#bfb1d2" font-weight="400" >Шаблоны для разных записей.</text><text x="56" y="454" font-size="14" fill="#c4a0ff" font-weight="600" letter-spacing="2">ОДНА СЕССИЯ</text><text x="56" y="492" font-size="26" fill="#f5f0ff" font-weight="400" >Разблокируйте один раз. Открывайте нужные файлы.</text><text x="56" y="543" font-size="18" fill="#bfb1d2" font-weight="400" >Ключ восстановления · Русский и английский · Desktop и Android</text></g></svg>