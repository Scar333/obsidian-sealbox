<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
<title id="title">SealBox features</title><desc id="desc">Notes, attachments and secrets in encrypted containers. One unlock per session, recovery keys, English and Russian.</desc>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1440" height="590" rx="0" fill="#171225" stroke="#171225"/><text x="56" y="64" font-size="34" fill="#f5f0ff" font-weight="600" >A private space, inside your vault.</text><rect x="56" y="108" width="432" height="278" rx="20" fill="#241c36" stroke="#48365f"/><text x="84" y="154" font-size="18" fill="#c4a0ff" font-weight="500" >01</text><text x="84" y="228" font-size="32" fill="#f5f0ff" font-weight="600" >Notes</text><text x="84" y="286" font-size="18" fill="#bfb1d2" font-weight="400" >Edit inside SealBox.</text><text x="84" y="317" font-size="18" fill="#bfb1d2" font-weight="400" >Save as an encrypted .sealed file.</text><rect x="504" y="108" width="432" height="278" rx="20" fill="#241c36" stroke="#48365f"/><text x="532" y="154" font-size="18" fill="#c4a0ff" font-weight="500" >02</text><text x="532" y="228" font-size="32" fill="#f5f0ff" font-weight="600" >Attachments</text><text x="532" y="286" font-size="18" fill="#bfb1d2" font-weight="400" >View images and PDFs.</text><text x="532" y="317" font-size="18" fill="#bfb1d2" font-weight="400" >Encrypt any file type.</text><rect x="952" y="108" width="432" height="278" rx="20" fill="#241c36" stroke="#48365f"/><text x="980" y="154" font-size="18" fill="#c4a0ff" font-weight="500" >03</text><text x="980" y="228" font-size="32" fill="#f5f0ff" font-weight="600" >Secrets</text><text x="980" y="286" font-size="18" fill="#bfb1d2" font-weight="400" >Logins, tags and custom fields.</text><text x="980" y="317" font-size="18" fill="#bfb1d2" font-weight="400" >Templates for different entries.</text><text x="56" y="454" font-size="14" fill="#c4a0ff" font-weight="600" letter-spacing="2">ONE SESSION</text><text x="56" y="492" font-size="26" fill="#f5f0ff" font-weight="400" >Unlock once. Open the files you need.</text><text x="56" y="543" font-size="18" fill="#bfb1d2" font-weight="400" >Recovery key · English and Russian · Desktop and Android</text></g></svg>