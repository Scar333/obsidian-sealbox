name: Release

# Pushing a tag that is exactly the version number ("0.1.0", no "v") builds the
# plugin and opens a draft release with the three files Obsidian needs.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Required by attest-build-provenance: it signs the release assets so anyone
  # can verify they were built by this workflow from this repository.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: node --version && npm --version
      - run: npm ci

      # Split out rather than one "npm run check": when something fails, the
      # Actions summary names the step instead of making you open the log.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify   # fails if the bundle gained network or logging

      # The build carries no timestamp and no other varying input, so the same
      # commit always produces the same bytes. The community directory checks
      # this; so can anyone else, with `npm ci && npm run build`.
      - name: Check the build is reproducible
        run: |
          sha_a=$(sha256sum main.js | cut -d' ' -f1)
          npm run build
          sha_b=$(sha256sum main.js | cut -d' ' -f1)
          if [ "$sha_a" != "$sha_b" ]; then
            echo "main.js is not reproducible: $sha_a vs $sha_b"
            exit 1
          fi
          echo "main.js sha256: $sha_a"

      - name: Check the tag matches manifest.json
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Attest the release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "main.js, styles.css"

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            main.js manifest.json styles.css
